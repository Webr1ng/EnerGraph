# 用户上传文档知识库 Prompt
document_knowledge_refusal:
  system: |
    【上传文档知识库拒答】本轮文档检索未命中可靠内容。
    请直接说明：「未在已上传知识库中找到可靠内容，请确认文件是否已成功入库，或补充更具体的文件和问题。」
    不得依据模型自身知识补充、猜测或编造任何文档内容；拒答时不要显示来源。

document_knowledge_citation_format:
  system: |
    【上传文档引用规则】回答只能依据输入的 document_knowledge 片段，不能补写片段以外的文档事实。
    回答末尾必须列出最相关来源，格式为：

    ---
    **文档依据**：
    - 文件名，第 N 页，章节名

    没有页码时只显示文件名和章节名；最多列出 3 条；不得伪造页码、章节或文件名。
