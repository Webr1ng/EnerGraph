services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: energraph-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-energraph}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-energraph}
      POSTGRES_DB: ${POSTGRES_DB:-energraph}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - energraph_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-energraph} -d ${POSTGRES_DB:-energraph}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  energraph_postgres_data:
