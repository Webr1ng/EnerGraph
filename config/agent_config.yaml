# Agent 配置文件（默认值，优先级: 环境变量 > 此文件）
# 实际运行时由 .env 中的 LLM_PROVIDER / DEEPSEEK_MODEL 等覆盖

# 模型配置
model:
  provider: "openai"          # .env LLM_PROVIDER 覆盖: deepseek | openai | anthropic
  name: "gpt-4o"              # .env DEEPSEEK_MODEL / OPENAI_MODEL / ANTHROPIC_MODEL 覆盖
  temperature: 0.7
  max_tokens: 2000

# Agent 配置
agent:
  max_iterations: 10          # .env AGENT_MAX_ITERATIONS 覆盖
  timeout: 60

# RAG 检索配置
rag:
  top_k: 3                    # 检索返回条数（Phase 3 从 5 降至 3，减少冗余）
  confidence_threshold: 0.6   # 置信度阈值，top-1 distance 超过此值标记 low_confidence
  # distance 在可回答/不可回答问题间存在重叠；明确域外或知识库不支持的主题需先行拒答
  unsupported_topic_terms: ["量子", "菜谱", "红烧肉", "晚餐", "面包", "烘焙", "咖啡", "拉花", "吃什么"]
  dedup_similarity: 0.98      # 去重相似度阈值，cosine_sim > 此值的重复片段被剔除（0.98 = 几乎完全相同才去重）
  embedding_local_files_only: true  # 运行时仅用本地缓存，避免 Hugging Face 联网检查阻塞
  prewarm_on_startup: true          # 每个生产 Worker 启动时预热 embedding + Chroma，消除首个 RAG 请求尖峰

# 工具列表（代码中通过 src/tools/__init__.py 的 TOOL_REGISTRY 注册，此处仅作记录）
# 当前工具：parse_business_intent, query_timedit_forecast, verify_physics_consistency,
#           fetch_aidc_cooling_status, query_hvac_knowledge

# 输出配置
output:
  language: "zh"
  format: "markdown"

# API 服务配置
api:
  host: "0.0.0.0"                   # .env API_HOST 覆盖
  port: 8000                        # .env API_PORT 覆盖
  cors_origins: ["*"]               # .env API_CORS_ORIGINS 覆盖（逗号分隔），生产环境应限定具体域名
  api_key: ""                       # .env API_KEY 覆盖；空 = 不启用鉴权（开发模式），填值后前端需带 Bearer token
  max_concurrent_streams: 4          # 单 Worker 同时执行 /stream Agent 图的最大请求数；0=不限制
  stream_queue_timeout_seconds: 1.0  # 并发槽耗尽时最多等待秒数，超时后快速返回 SSE error+done
  stream_event_timeout_seconds: 30.0 # 等待下一条 Graph 事件的最长秒数；0=不限制
  stream_execution_timeout_seconds: 90.0 # 单次 Agent 图执行总预算秒数；0=不限制

# 记忆模块配置（默认关闭；开启后 L1 checkpoint / L2 store 共用 PostgreSQL）
memory:
  enabled: false
  postgres_dsn: ""                    # 敏感连接信息必须由 .env / 服务器环境变量注入
  checkpoint_table: "checkpoints"
  store_table: "store"
  namespace_prefix: "energraph"
  env: "dev"
  default_site_id: "local"
  default_agent_id: "main_graph"
  default_ttl_seconds: 0
  auto_extract_enabled: false
  extract_min_confidence: 0.65
  max_memories_per_turn: 3
  device_state_default_ttl_seconds: 86400
  strict_msgpack: true
  use_postgres_store: false
  postgres_pool_min_size: 1
  postgres_pool_max_size: 10
  postgres_setup_enabled: false
  demo_file_store_enabled: false
  demo_file_store_path: "data/long_term_memory_demo/memories.json"
